services:
  postgres:
    image: postgres:16-alpine
    environment:
      POSTGRES_USER: realchat
      POSTGRES_PASSWORD: realchat
      POSTGRES_DB: realchat
    ports:
      - "5433:5432"
    volumes:
      - realchat_pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U realchat"]
      interval: 2s
      timeout: 3s
      retries: 15

  server:
    build:
      context: .
      dockerfile: server/Dockerfile
    depends_on:
      postgres:
        condition: service_healthy
    environment:
      PORT: 3000
      DATABASE_URL: postgres://realchat:realchat@postgres:5432/realchat
      JWT_SECRET: change-me-in-production
      CLIENT_ORIGIN: http://localhost:4173
    ports:
      - "3000:3000"

  client:
    build:
      context: .
      dockerfile: client/Dockerfile
      args:
        VITE_API_URL: http://localhost:3000
    ports:
      - "4173:4173"

volumes:
  realchat_pgdata:
